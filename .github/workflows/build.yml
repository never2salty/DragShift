name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Download FFmpeg (BtbN, GPL build with x264/x265/LAME/Opus/VP9, NVENC/QSV/AMF)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $names = gh release view latest -R BtbN/FFmpeg-Builds --json assets -q ".assets[].name"
          # newest numbered release (ffmpeg-n8.x-latest-win64-gpl-8.x.zip), else master
          $rel = $names | Where-Object { $_ -match '^ffmpeg-n(\d+)\.(\d+)-latest-win64-gpl-[\d.]+\.zip$' } |
                 Sort-Object { [version]($_ -replace '^ffmpeg-n([\d.]+)-.*$', '$1') } | Select-Object -Last 1
          if (-not $rel) { $rel = "ffmpeg-master-latest-win64-gpl.zip" }
          "Using $rel"
          gh release download latest -R BtbN/FFmpeg-Builds -p $rel -D ffdl
          Expand-Archive "ffdl\$rel" -DestinationPath ffdl\x
          New-Item -ItemType Directory -Force ffmpeg-bin | Out-Null
          Get-ChildItem ffdl\x -Recurse -Filter ffmpeg.exe | Select-Object -First 1 | Copy-Item -Destination ffmpeg-bin\ffmpeg.exe
          Get-ChildItem ffdl\x -Recurse -Filter LICENSE.txt | Select-Object -First 1 | Copy-Item -Destination ffmpeg-bin\FFMPEG-LICENSE.txt
          & ffmpeg-bin\ffmpeg.exe -hide_banner -version | Select-Object -First 1
          "DRAGSHIFT_FFMPEG=$PWD\ffmpeg-bin\ffmpeg.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download OpenSCAD (for .scad files)
        shell: pwsh
        run: |
          $ProgressPreference = "SilentlyContinue"
          Invoke-WebRequest "https://files.openscad.org/OpenSCAD-2021.01-x86-64.zip" -OutFile scad.zip
          Expand-Archive scad.zip -DestinationPath scaddl
          $exe = Get-ChildItem scaddl -Recurse -Filter openscad.exe | Select-Object -First 1
          Copy-Item $exe.Directory.FullName -Destination openscad-bin -Recurse
          Remove-Item openscad-bin\openscad.com -ErrorAction SilentlyContinue
          Get-ChildItem openscad-bin | Select-Object -First 8
          "DRAGSHIFT_OPENSCAD=$PWD\openscad-bin\openscad.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        shell: pwsh
        run: |
          python -m pytest tests -q -rfE -p no:cacheprovider 2>&1 | Tee-Object -FilePath pytest-out.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # failures as annotations: visible on the run page without downloading logs
            Get-Content pytest-out.txt | Where-Object { $_ -match '^(FAILED|ERROR) ' } |
              Select-Object -First 25 | ForEach-Object { "::error::$($_ -replace '[\r\n]', ' ')" }
            Get-Content pytest-out.txt | Where-Object { $_ -match '^E  ' } |
              Select-Object -First 20 | ForEach-Object { "::warning::$($_ -replace '[\r\n]', ' ')" }
            exit $code
          }
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build app folder (for the installer)
        run: pyinstaller DragShift.spec --noconfirm

      - name: Build portable DragShift.exe
        run: pyinstaller DragShift.spec --noconfirm
        env:
          ONEFILE: "1"

      - name: Smoke-test both builds (bundled FFmpeg only)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          Remove-Item Env:DRAGSHIFT_FFMPEG
          Remove-Item Env:DRAGSHIFT_OPENSCAD
          $log = "$env:LOCALAPPDATA\DragShift\log.txt"
          foreach ($exe in @("dist\DragShift\DragShift.exe", "dist\DragShift.exe")) {
            $p = Start-Process -FilePath $exe -ArgumentList "--selftest" -PassThru
            if (-not $p.WaitForExit(420000)) {
              Get-Process | Where-Object { $_.ProcessName -match 'openscad|ffmpeg|DragShift' } | ForEach-Object { "::warning::still running: $($_.ProcessName)" }
              Get-Content $log -Tail 25 | ForEach-Object { "::warning::log: $_" }
              Stop-Process -Name DragShift,openscad,ffmpeg -Force -ErrorAction SilentlyContinue
              throw "Self-test timed out for $exe"
            }
            if ($p.ExitCode -ne 0) { Get-Content $log -Tail 40 | ForEach-Object { "::warning::log: $_" }; throw "Self-test failed for $exe ($($p.ExitCode))" }
            "Self-test passed: $exe"
          }
          Get-Content "$env:LOCALAPPDATA\DragShift\log.txt" -Tail 8
          "{0:N1} MB portable" -f ((Get-Item dist\DragShift.exe).Length / 1MB)

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc installer\DragShift.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          "{0:N1} MB installer" -f ((Get-Item dist\DragShift-Setup.exe).Length / 1MB)

      - name: Test the installer (silent install, run, uninstall)
        shell: pwsh
        run: |
          $p = Start-Process dist\DragShift-Setup.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /TASKS=contextmenu" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Install failed ($($p.ExitCode))" }
          $app = "$env:LOCALAPPDATA\Programs\DragShift\DragShift.exe"
          if (-not (Test-Path $app)) { throw "App not installed" }
          $env:QT_QPA_PLATFORM = "offscreen"
          $t = Start-Process $app -ArgumentList "--selftest" -Wait -PassThru
          if ($t.ExitCode -ne 0) { throw "Installed app self-test failed" }
          Remove-Item Env:QT_QPA_PLATFORM
          $u = Start-Process "$env:LOCALAPPDATA\Programs\DragShift\unins000.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES" -Wait -PassThru
          Start-Sleep 3
          if (Test-Path "HKCU:\Software\Classes\*\shell\DragShift") { throw "Uninstall left the context menu behind" }
          "Installer OK"

      - uses: actions/upload-artifact@v4
        with:
          name: DragShift-Windows
          path: |
            dist/DragShift.exe
            dist/DragShift-Setup.exe

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path dragshift\__init__.py -Pattern '"([\d.]+)"').Matches[0].Groups[1].Value
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish release (main branch and v* tags)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: DragShift ${{ steps.ver.outputs.version }}
          make_latest: true
          body: |
            **DragShift-Setup.exe** installieren (für den eigenen Benutzer, keine Adminrechte) – oder **DragShift.exe** portabel starten.
            Windows SmartScreen warnt, weil die App nicht signiert ist: *Weitere Informationen → Trotzdem ausführen*.

            Neu in 1.4: Screenshots aus Videos – kleiner Player mit Slider, Bild-für-Bild, schnellem Abspielen und framegenauem Speichern als PNG/JPG.
          files: |
            dist/DragShift.exe
            dist/DragShift-Setup.exe
